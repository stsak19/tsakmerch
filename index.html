<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Κρεμάστρα</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
/* Layout: full-bleed 3D store wall with the rack; thin UI floats over it (tabs top, focus label bottom, detail sheet on pick). Single deliberate look: a lit shop wall. */
:root{
  --wall:#c9c1b4;
  --ink:#1c1a17;
  --paper:#f5f2ed;
  --muted:#6b645a;
  --line:rgba(28,26,23,.16);
  --accent:#2440b8;
  --ok:#2f7a4b;
  --f-ui:'Commissioner', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas.grabbing{cursor:grabbing}
#stage canvas.hovering{cursor:pointer}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 38%,transparent 55%,rgba(30,24,16,.28) 100%)}

header{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
header > *{pointer-events:auto}
.brand{font-weight:900;font-size:22px;letter-spacing:-.02em;line-height:1;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-weight:400;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
nav.tabs{display:flex;gap:4px;background:rgba(245,242,237,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:4px}
nav.tabs button{font:600 13px/1 var(--f-ui);border:0;background:transparent;color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer;display:flex;gap:7px;align-items:center;transition:background .2s,color .2s}
nav.tabs button span{font:400 10px/1 var(--f-mono);opacity:.6}
nav.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
nav.tabs button:focus-visible,.btn:focus-visible,.size:focus-visible,.arrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cart{margin-left:auto;font:600 13px/1 var(--f-ui);display:flex;align-items:center;gap:8px;background:rgba(245,242,237,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:9px 14px}
.cart b{font:600 11px/1 var(--f-mono);background:var(--accent);color:#fff;border-radius:999px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}

.focusbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);padding-top:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;transition:opacity .35s,transform .35s}
.focusbar.away{opacity:0;transform:translateY(20px)}
.focuscard{pointer-events:auto;display:flex;align-items:center;gap:14px;background:rgba(245,242,237,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:18px;padding:8px;max-width:100%}
.arrow{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer;flex:none}
.arrow:hover{background:#fff}
.fmeta{min-width:0;text-align:center;padding:0 4px}
.fmeta .n{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta .s{font:400 11px/1.4 var(--f-mono);color:var(--muted);white-space:nowrap}
.fmeta .s b{color:var(--ink);font-weight:600}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);transform:translateX(-50%);font:400 11px/1.4 var(--f-mono);color:rgba(28,26,23,.62);letter-spacing:.04em;white-space:nowrap;pointer-events:none;transition:opacity .6s}
.hint.gone{opacity:0}

aside.sheet{position:fixed;top:calc(env(safe-area-inset-top,0px) + 78px);right:max(16px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:min(360px,calc(100vw - 32px));
  background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 30px 60px -30px rgba(40,30,20,.45);display:flex;flex-direction:column;overflow:auto;
  transform:translateX(calc(100% + 40px));transition:transform .55s cubic-bezier(.2,.8,.2,1)}
aside.sheet.open{transform:none}
.sheet .in{padding:22px;display:flex;flex-direction:column;gap:18px;flex:1}
.sheet .cat{font:400 10px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sheet h2{margin:0;font-weight:900;font-size:28px;line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.sheet .price{font:600 22px/1 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.sheet p{margin:0;line-height:1.55;color:#3a362f;font-size:14px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;margin:0}
.spec dt{font:400 10.5px/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.spec dd{margin:0}
.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.size{font:600 12px/1 var(--f-mono);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;height:40px;cursor:pointer}
.size[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.size:disabled{color:#b5aea4;background:transparent;text-decoration:line-through;cursor:not-allowed}
.lbl{font:400 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{font:700 14px/1 var(--f-ui);border-radius:14px;height:48px;border:1px solid var(--ink);cursor:pointer}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{background:#000}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.rotate-tip{font:400 10.5px/1.4 var(--f-mono);color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translate(-50%,-12px);opacity:0;background:var(--ink);color:var(--paper);font:600 13px/1 var(--f-ui);padding:12px 16px;border-radius:12px;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.loading{position:fixed;inset:0;display:grid;place-items:center;font:400 12px/1 var(--f-mono);letter-spacing:.1em;color:var(--muted);background:var(--wall);transition:opacity .6s}
.loading.done{opacity:0;pointer-events:none}

@media (max-width:720px){
  header{gap:10px}
  .brand small{display:none}
  nav.tabs{order:3;width:100%;justify-content:space-between}
  nav.tabs button{flex:1;justify-content:center;padding:9px 6px;font-size:12.5px}
  aside.sheet{top:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:52%;transform:translateY(calc(100% + 40px))}
  .sheet .in{padding:18px;gap:14px}
  .sheet h2{font-size:22px}
  .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 80px);font-size:10px;white-space:normal;text-align:center;width:calc(100% - 32px)}
}
@media (prefers-reduced-motion: reduce){ aside.sheet,.focusbar,.toast{transition:none} }
</style>
</head>
<body>

<div id="stage"></div>
<div class="vignette"></div>
<div class="loading" id="loading">ΚΡΕΜΑΜΕ ΤΑ ΡΟΥΧΑ…</div>

<header>
  <div class="brand">Κρεμάστρα <small>Καλοκαίρι / Φθινόπωρο</small></div>
  <nav class="tabs" id="tabs" aria-label="Κατηγορίες"></nav>
  <div class="cart" aria-live="polite">Καλάθι <b id="cartCount">0</b></div>
</header>

<div class="hint" id="hint">Σύρε ή κάνε scroll για να ψάξεις · Κλικ στο ρούχο για να το βγάλεις</div>

<div class="focusbar" id="focusbar">
  <div class="focuscard">
    <button class="arrow" id="prev" aria-label="Προηγούμενο ρούχο">‹</button>
    <div class="fmeta"><div class="n" id="fName">–</div><div class="s" id="fSub">–</div></div>
    <button class="arrow" id="next" aria-label="Επόμενο ρούχο">›</button>
  </div>
</div>

<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="in">
    <div class="cat" id="sCat"></div>
    <h2 id="sName"></h2>
    <div class="price" id="sPrice"></div>
    <p id="sDesc"></p>
    <dl class="spec">
      <dt>Σύνθεση</dt><dd id="sComp"></dd>
      <dt>Βάρος</dt><dd id="sGsm"></dd>
      <dt>Γραμμή</dt><dd id="sFit"></dd>
    </dl>
    <div>
      <div class="lbl"><span>Μέγεθος</span><span id="sStock"></span></div>
      <div class="sizes" id="sizes" style="margin-top:8px"></div>
    </div>
    <div class="actions">
      <div class="rotate-tip">Σύρε το ρούχο για να δεις και την πλάτη</div>
      <button class="btn primary" id="addCart">Προσθήκη στο καλάθι</button>
      <button class="btn ghost" id="putBack">Πίσω στην κρεμάστρα</button>
    </div>
  </div>
</aside>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function kremastraMain(PHOTOS){
'use strict';
/* ------------------------------------------------------------------ data */
const CATS = [
  {key:'tank',  name:'Αμάνικα'},
  {key:'hoodie',name:'Hoodies'},
  {key:'tee',   name:'Κοντομάνικα'}
];
const RAW = [
  // Αμάνικα
  {cat:0,name:'Ribbed αμάνικο',color:'#efeae0',ink:'#1c1a17',print:'none',price:16,comp:'95% βαμβάκι · 5% ελαστάνη',gsm:180,fit:'Εφαρμοστή',desc:'Ριπ πλέξη που αγκαλιάζει το σώμα. Το βασικό λευκό του καλοκαιριού.'},
  {cat:0,name:'Αμάνικο Μελτέμι',color:'#26262a',ink:'#f2efe8',print:'text',text:'ΜΕΛΤΕΜΙ',price:19,comp:'100% βαμβάκι',gsm:190,fit:'Κανονική',desc:'Μαύρο αμάνικο με τυπωμένο λογότυπο στο στήθος.'},
  {cat:0,name:'Αθλητικό αμάνικο',color:'#5b6a44',ink:'#e9e2cf',print:'edge',price:18,comp:'60% βαμβάκι · 40% πολυεστέρας',gsm:160,fit:'Χαλαρή',desc:'Ελαφρύ, γρήγορο στέγνωμα, με αντίθετο ρέλι σε λαιμό και μασχάλες.'},
  {cat:0,name:'Αμάνικο Heather',color:'#a6a6a2',ink:'#2a2a2a',print:'logo',price:17,comp:'90% βαμβάκι · 10% βισκόζη',gsm:170,fit:'Κανονική',desc:'Γκρι μελανζέ με μικρό κεντητό σήμα.'},
  {cat:0,name:'Αμάνικο Θήρα',color:'#2c4a78',ink:'#f4efe4',print:'text',text:'ΘΗΡΑ',price:19,comp:'100% βαμβάκι',gsm:190,fit:'Κανονική',desc:'Βαθύ μπλε, εμπνευσμένο από το Αιγαίο το απόγευμα.'},
  {cat:0,name:'Αμάνικο Άμμος',color:'#d6c19c',ink:'#3b3225',print:'none',price:16,comp:'100% οργανικό βαμβάκι',gsm:175,fit:'Χαλαρή',desc:'Χρώμα άμμου, πλυμένο για μαλακή υφή από την πρώτη μέρα.'},
  {cat:0,name:'Αμάνικο No.23',color:'#86303a',ink:'#f3e9dc',print:'big',text:'23',price:20,comp:'100% βαμβάκι',gsm:200,fit:'Oversized',desc:'Μπορντό με μεγάλο αριθμό, σε άνετη oversized γραμμή.'},
  // Hoodies
  {cat:1,name:'Hoodie Βασικό',color:'#97989b',ink:'#222',print:'none',price:49,comp:'80% βαμβάκι · 20% πολυεστέρας',gsm:340,fit:'Κανονική',desc:'Χνουδωτό εσωτερικό, τσέπη καγκουρό και κορδόνια με μεταλλικές άκρες.'},
  {cat:1,name:'Hoodie Όλυμπος',color:'#1f1f23',ink:'#efe9de',print:'text',text:'ΟΛΥΜΠΟΣ',price:55,comp:'80% βαμβάκι · 20% πολυεστέρας',gsm:360,fit:'Κανονική',desc:'Βαρύ μαύρο φούτερ με κουκούλα και τύπωμα στο στήθος.'},
  {cat:1,name:'Hoodie Δάσος',color:'#3d4934',ink:'#e8e0c9',print:'logo',price:52,comp:'100% βαμβάκι',gsm:350,fit:'Χαλαρή',desc:'Σκούρο λαδί με μικρό κεντητό σήμα.'},
  {cat:1,name:'Hoodie Αέρας',color:'#8eadca',ink:'#1d2a3a',print:'text',text:'ΑΕΡΑΣ',price:52,comp:'80% βαμβάκι · 20% πολυεστέρας',gsm:330,fit:'Κανονική',desc:'Απαλό γαλάζιο, ιδανικό για βραδιές δίπλα στη θάλασσα.'},
  {cat:1,name:'Hoodie Κρασί',color:'#5b1f2b',ink:'#eadcd0',print:'none',price:49,comp:'80% βαμβάκι · 20% πολυεστέρας',gsm:340,fit:'Κανονική',desc:'Βαθύ μπορντό, ζεστό και καθαρό σχέδιο χωρίς τύπωμα.'},
  {cat:1,name:'Hoodie 1987',color:'#ebe3d3',ink:'#2a2620',print:'big',text:'1987',price:55,comp:'100% βαμβάκι',gsm:380,fit:'Oversized',desc:'Κρεμ φούτερ με μεγάλο vintage αριθμό.'},
  {cat:1,name:'Hoodie Navy Stripe',color:'#1e2a45',ink:'#e9e4d8',print:'sleeve',price:52,comp:'80% βαμβάκι · 20% πολυεστέρας',gsm:340,fit:'Κανονική',desc:'Σκούρο μπλε με διπλή ρίγα στα μανίκια.'},
  // Κοντομάνικα
  {cat:2,name:'T-shirt με τσέπη',color:'#f5f3ee',ink:'#1c1a17',print:'pocket',price:22,comp:'100% βαμβάκι',gsm:220,fit:'Κανονική',desc:'Λευκό heavyweight μπλουζάκι με τσέπη στο στήθος.'},
  {cat:2,name:'T-shirt Μαύρο',color:'#1f1f21',ink:'#eee',print:'none',photo:'teeBlack',price:22,comp:'100% βαμβάκι',gsm:220,fit:'Κανονική',desc:'Το μαύρο μπλουζάκι που φοράς με όλα.'},
  {cat:2,name:'T-shirt Ακρογιαλιά',color:'#c6d6cc',ink:'#23392f',print:'text',text:'ΑΚΡΟΓΙΑΛΙΑ',price:25,comp:'100% οργανικό βαμβάκι',gsm:200,fit:'Χαλαρή',desc:'Μέντα με τυπωμένη λέξη στο στήθος.'},
  {cat:2,name:'T-shirt Ναυτικό',color:'#f2efe7',ink:'#1f2d52',print:'stripes',price:27,comp:'100% βαμβάκι',gsm:230,fit:'Κανονική',desc:'Κλασική ναυτική ρίγα, μπλε πάνω σε εκρού.'},
  {cat:2,name:'T-shirt Μουστάρδα',color:'#c69a32',ink:'#2a2214',print:'logo',price:24,comp:'100% βαμβάκι',gsm:210,fit:'Κανονική',desc:'Ζεστό κίτρινο της μουστάρδας με μικρό σήμα.'},
  {cat:2,name:'T-shirt No.07',color:'#4a4c51',ink:'#efe9dc',print:'big',text:'07',price:25,comp:'100% βαμβάκι',gsm:220,fit:'Oversized',desc:'Γραφίτης με μεγάλο αριθμό, oversized γραμμή.'},
  {cat:2,name:'T-shirt Ρόδι',color:'#b4525d',ink:'#f6ebe0',print:'none',price:22,comp:'100% βαμβάκι',gsm:220,fit:'Κανονική',desc:'Το κόκκινο του ροδιού, πλυμένο για ξεθωριασμένο τόνο.'}
];
const SIZES = ['XS','S','M','L','XL','XXL'];
const ITEMS = RAW.map((r,i)=>Object.assign({}, r, {
  idx:i, type:CATS[r.cat].key, seed: (i*7.31)%6.28,
  stock: SIZES.map((s,k)=> ((i*5 + k*3) % 11) !== 0 && !(k===0 && i%3===0))
}));
const N = ITEMS.length;

/* ------------------------------------------------------------------ helpers */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function shade(hex,amt){ // amt -1..1
  const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255;
  const t=amt<0?0:255, p=Math.abs(amt);
  r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b);
  return `rgb(${r},${g},${b})`;
}
function lum(hex){const n=parseInt(hex.slice(1),16);return (0.3*(n>>16)+0.59*((n>>8)&255)+0.11*(n&255))/255;}

/* ------------------------------------------------------------------ garment silhouettes (canvas px, 512 x 640) */
const CW=512, CH=640;
const NECK = {tee:40, tank:28, hoodie:44};
const THICK = {tee:0.022, tank:0.016, hoodie:0.04};
function pathTee(){const p=new Path2D();
  p.moveTo(200,40); p.quadraticCurveTo(256,60,312,40);
  p.lineTo(372,58); p.quadraticCurveTo(432,90,476,150); p.lineTo(426,206);
  p.quadraticCurveTo(398,192,374,184); p.quadraticCurveTo(370,400,380,612);
  p.quadraticCurveTo(256,624,132,612); p.quadraticCurveTo(142,400,138,184);
  p.quadraticCurveTo(114,192,86,206); p.lineTo(36,150); p.quadraticCurveTo(80,90,140,58);
  p.closePath(); return p;}
function pathTank(){const p=new Path2D();
  p.moveTo(176,26); p.lineTo(214,26); p.quadraticCurveTo(256,96,298,26); p.lineTo(336,26);
  p.quadraticCurveTo(338,172,374,236); p.quadraticCurveTo(366,420,376,612);
  p.quadraticCurveTo(256,624,136,612); p.quadraticCurveTo(146,420,138,236);
  p.quadraticCurveTo(174,172,176,26); p.closePath(); return p;}
function pathHoodie(){const p=new Path2D();
  p.moveTo(170,62); p.bezierCurveTo(166,4,346,4,342,62);
  p.lineTo(392,76); p.quadraticCurveTo(444,112,454,262);
  p.lineTo(470,560); p.lineTo(474,606); p.lineTo(410,612); p.lineTo(406,566);
  p.lineTo(396,330); p.lineTo(390,560); p.lineTo(394,622);
  p.quadraticCurveTo(256,632,118,622); p.lineTo(122,560); p.lineTo(116,330);
  p.lineTo(106,566); p.lineTo(102,612); p.lineTo(38,606); p.lineTo(42,560);
  p.lineTo(58,262); p.quadraticCurveTo(68,112,120,76); p.closePath(); return p;}
const PATHS={tee:pathTee,tank:pathTank,hoodie:pathHoodie};

/* ------------------------------------------------------------------ texture painting */
function fitText(g,txt,maxW,size,weight){
  let s=size; g.font=`${weight} ${s}px Commissioner, "Segoe UI", sans-serif`;
  while(g.measureText(txt).width>maxW && s>12){ s-=2; g.font=`${weight} ${s}px Commissioner, "Segoe UI", sans-serif`; }
  return s;
}
function stitch(g,draw,col){ g.save(); g.strokeStyle=col; g.lineWidth=1.6; g.setLineDash([5,4]); g.beginPath(); draw(); g.stroke(); g.restore(); }
function seam(g,draw,w){ g.save(); g.strokeStyle='rgba(0,0,0,.16)'; g.lineWidth=w||2.4; g.beginPath(); draw(); g.stroke();
  g.strokeStyle='rgba(255,255,255,.07)'; g.lineWidth=1.2; g.translate(1.5,1.5); g.beginPath(); draw(); g.stroke(); g.restore(); }
function rib(g,x0,y0,x1,y1,col,step){ g.save(); g.beginPath(); g.rect(x0,y0,x1-x0,y1-y0); g.clip();
  g.fillStyle=col; g.fillRect(x0,y0,x1-x0,y1-y0);
  g.strokeStyle='rgba(0,0,0,.13)'; g.lineWidth=1.4; for(let x=x0;x<x1;x+=step||5){g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1);g.stroke();}
  g.restore(); }

function paintGarment(item, back){

/* ------------------------------------------------------------------ rack layout */
const RAIL_Y=1.74, HOOK=0.105, S=0.6/CW;
const SPACING=0.12, GAP=0.43, CAT_GAP=0.32, YAW_SIDE=1.22;
function catOf(f){ // continuous category coordinate at focus f

const rail=new THREE.Mesh(new THREE.CylinderGeometry(.0135,.0135,railLen,24),chrome); rail.rotation.z=Math.PI/2; rail.position.set((railX0+railX1)/2,RAIL_Y,0); rail.castShadow=true; rack.add(rail);
[railX0,railX1].forEach(x=>{

/* hanger geometry (shared) */
const hookCurve=new THREE.CatmullRomCurve3([

const wood=new THREE.MeshStandardMaterial({map:woodTex,roughness:.42,metalness:0,envMapIntensity:.8});

  const w = type==='tank'? .175 : type==='hoodie'? .19 : .18;
  const yTop=-HOOK-.006, yEnd=-HOOK-.06;
  const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(-w,yEnd,0),new THREE.Vector3(0,yTop+.035,0),new THREE.Vector3(w,yEnd,0));

const barGeos={tee:hangerBar('tee'),tank:hangerBar('tank'),hoodie:hangerBar('hoodie')};

/* garment meshes */
const maskCache={};
function garmentGeo(item,sign,src,key){
  key=key||item.type;
  const masks=maskCache[key]||(maskCache[key]=buildMasks(item.type,src));
  const geo=new THREE.PlaneGeometry(CW*S,CH*S,52,64);
  const pos=geo.attributes.position, uv=geo.attributes.uv, T=THICK[item.type];
  for(let i=0;i<pos.count;i++){
    const u=uv.getX(i), v=1-uv.getY(i);
    let h=clamp((sample(masks.soft,u,v)-.5)/.5,0,1); h=Math.sqrt(h);
    if(src){ // a real photo already has its folds: keep the card almost flat, just a soft bow
      pos.setZ(i, (sign*.004 + Math.sin(u*Math.PI)*.008*(1-v*.6)) * h); continue; }
    const drop=Math.pow(v,1.3);
    const fold=(Math.sin(u*Math.PI*7+item.seed)*.55+Math.sin(u*Math.PI*13+item.seed*2.1)*.3+Math.sin(u*Math.PI*3.3+item.seed*.7)*.5)*drop;
    const bow=Math.sin(u*Math.PI)*0.012*(1-v);
    pos.setZ(i, (sign*T*(.55+.45*(1-drop*.4)) + fold*.0075 + bow) * h);
  }
  geo.computeVertexNormals();
  return {geo,masks};
}

const dividers=[];
CATS.forEach((cat,ci)=>{

/* ------------------------------------------------------------------ state & targets */
let f=-1.2, fV=0, fT=3; // continuous focus index; start off-screen and glide in
let dragging=false, carried=-1;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const camPos=new THREE.Vector3(camXFor(fT),1.3,1.9), camLook=new THREE.Vector3(camXFor(fT),1.22,0);
let camDist=2.55;
const parallax={x:0,y:0,tx:0,ty:0};
const holdTmp=new THREE.Vector3();

function holdPoint(out){
  const narrow=innerWidth<=720;
  const nx = narrow ? 0 : -0.28, ny = narrow ? 0.5 : 0.06; // NDC of garment centre
  out.set(nx,ny,0.5).unproject(camera).sub(camera.position).normalize();
  const dist = narrow ? 1.9 : 1.2;
  out.multiplyScalar(dist).add(camera.position); out.y += 0.4; // pivot is above the garment centre
  return out;
}
function computeTargets(){
  const fc=clamp(f,-.6,N-.4);
  for(const h of hangables){
    if(h.kind==='garment'){
      const d=h.i-fc;
      h.tgt.set(baseX(h.i)+spread(d), RAIL_Y, 0);
      h.tYaw=-clamp(d,-1,1)*YAW_SIDE*(Math.abs(d)<1?Math.sqrt(Math.abs(d)):1)*1;
      if(h.carried){ holdPoint(h.tgt); const dx=camera.position.x-h.tgt.x, dz=camera.position.z-h.tgt.z; h.tYaw=Math.atan2(dx,dz)+h.userYaw; }
    }
  }
  for(const dv of dividers){
    const a=dv.first>0? hangables[dv.first-1] : null, b=hangables[dv.first];
    const bx=b.tgt.x, ax=a? a.tgt.x : bx-0.5;
    dv.tgt.set(a? (ax+bx)/2 : bx-0.32, RAIL_Y, 0);
    dv.tYaw = a ? (a.tYaw+b.tYaw)/2 : b.tYaw;
  }
}

/* ------------------------------------------------------------------ physics */
const G=9.81;
function step(dt){
  // focus spring
  if(!dragging){ const k=reduce?90:46, c=2*Math.sqrt(k)*(reduce?1:.92); const a=k*(fT-f)-c*fV; fV+=a*dt; f+=fV*dt; }
  computeTargets();
  for(const h of hangables){
    const k = h.carried ? 26 : 120, zeta = h.carried ? .78 : (reduce?1:.62), c=2*Math.sqrt(k)*zeta;
    const ax=k*(h.tgt.x-h.x)-c*h.vx, ay=k*(h.tgt.y-h.y)-c*h.vy, az=k*(h.tgt.z-h.z)-c*h.vz;
    h.vx+=ax*dt; h.vy+=ay*dt; h.vz+=az*dt; h.x+=h.vx*dt; h.y+=h.vy*dt; h.z+=h.vz*dt;
    const w2=G/h.L, damp = reduce?7:(h.carried?2.2:2.1);
    // lateral swing driven by rail acceleration (hook rocks on the rail)
    const atz=-w2*Math.sin(h.tz)-damp*h.vtz-ax/h.L*.38; h.vtz+=atz*dt; h.tz+=h.vtz*dt;
    // fore/aft swing about the rail axis
    const atx=-w2*Math.sin(h.tx)-damp*h.vtx+az/h.L*.45; h.vtx+=atx*dt; h.tx+=h.vtx*dt;
    h.tz=clamp(h.tz,-.5,.5); h.tx=clamp(h.tx,-.6,.6);
    // yaw lags behind (hook twisting on the rail)
    const ky=h.carried?18:34, cy=2*Math.sqrt(ky)*(reduce?1:.58); const ayw=ky*(h.tYaw-h.yaw)-cy*h.vyaw; h.vyaw+=ayw*dt; h.yaw+=h.vyaw*dt;
  }
}
function apply(){
  for(const h of hangables){
    h.pivot.position.set(h.x,h.y,h.z);
    h.swing.rotation.set(h.tx,0,h.tz);
    h.spin.rotation.y=h.yaw;
    if(h.meshes && h.meshes[0].material.isMeshBasicMaterial){ // turned-away photos sit in the rack's shade
      const l=.6+.4*Math.abs(Math.cos(h.yaw)); h.meshes[0].material.color.setScalar(l); h.meshes[1].material.color.setScalar(l); }
  }
}
// initialise positions at their targets (entrance glide comes from f)
computeTargets(); for(const h of hangables){ h.x=h.tgt.x+ (h.kind==='garment'? -0.0:0); h.y=h.tgt.y; h.z=h.tgt.z; h.yaw=h.tYaw; }

/* ------------------------------------------------------------------ camera */
function layoutCamera(){
  const asp=innerWidth/innerHeight; camera.aspect=asp;
  const halfV=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  camDist=Math.max(2.55, 0.46/(halfV*asp));
  camera.updateProjectionMatrix();
}
layoutCamera();
function updateCamera(dt){
  const cx=camXFor(clamp(f,-.6,N-.4));
  parallax.x+=(parallax.tx-parallax.x)*Math.min(1,dt*3); parallax.y+=(parallax.ty-parallax.y)*Math.min(1,dt*3);
  const k=Math.min(1,dt*6);
  camLook.x+=(cx-camLook.x)*k;
  const tx=cx+parallax.x*.12, ty=1.32+parallax.y*.05, tz=camDist;
  camPos.x+=(tx-camPos.x)*k; camPos.y+=(ty-camPos.y)*k; camPos.z+=(tz-camPos.z)*k;
  camera.position.copy(camPos); camera.lookAt(camLook.x+parallax.x*.03, 1.24+(innerWidth<=720?.08:0), 0);
  key.position.set(camLook.x+1.1,4.2,3.2); key.target.position.set(camLook.x,1,0);
  fill.position.set(camLook.x-2.5,1.6,2); fill.target.position.set(camLook.x,1.2,0);
  spot.position.set(camLook.x,3.1,1.3); spot.target.position.set(camLook.x,1.2,0);
}

/* ------------------------------------------------------------------ interaction */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
const garmentMeshes=hangables.filter(h=>h.kind==='garment').flatMap(h=>h.meshes);
function pick(clientX,clientY){
  const r=canvasEl.getBoundingClientRect(); ndc.set((clientX-r.left)/r.width*2-1, -((clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(garmentMeshes,false);
  for(const h of hits){ if(!h.uv) continue; const u=h.uv.x, v=1-h.uv.y; if(sample(h.object.userData.masks.hit,u,v)>.5) return h.object.userData.item; }
  return -1;
}
const pxPerItem=()=>Math.max(70, innerHeight*0.16);
let down=null, lastMove=null, hoverI=-1;
canvasEl.addEventListener('pointerdown',e=>{
  canvasEl.setPointerCapture(e.pointerId);
  down={x:e.clientX,y:e.clientY,t:performance.now(),f0:f,moved:false,id:e.pointerId,yaw0: carried>=0?hangables[carried].userYaw:0};
  lastMove={x:e.clientX,t:performance.now(),v:0};
  dismissHint();
});
canvasEl.addEventListener('pointermove',e=>{
  const r=canvasEl.getBoundingClientRect();
  parallax.tx=((e.clientX-r.left)/r.width-.5)*2; parallax.ty=-((e.clientY-r.top)/r.height-.5)*2;
  const now=performance.now();
  if(down){
    const dx=e.clientX-down.x;
    if(!down.moved && Math.abs(dx)>6){ down.moved=true; if(carried<0){ dragging=true; canvasEl.classList.add('grabbing'); } }
    if(down.moved){
      if(carried>=0){ hangables[carried].userYaw=down.yaw0+dx*0.012; }
      else {
        let raw=down.f0-dx/pxPerItem();
        if(raw<0) raw=raw*.35; if(raw>N-1) raw=N-1+(raw-(N-1))*.35;
        const dtm=Math.max(1,now-lastMove.t); const inst=(raw-f)/(dtm/1000);
        fV=fV*.6+inst*.4; f=raw; fT=f;
      }
    }
    lastMove={x:e.clientX,t:now};
  } else if(carried<0){
    // brushing past garments nudges them
    const i=pick(e.clientX,e.clientY);
    if(i>=0){ const h=hangables[i]; const vx=e.movementX||0, vy=e.movementY||0; h.vtz+=clamp(vx,-40,40)*0.012; h.vtx+=clamp(-vy,-40,40)*0.006; h.vyaw+=clamp(vx,-40,40)*0.01; }
    if(i!==hoverI){ hoverI=i; canvasEl.classList.toggle('hovering',i>=0); }
  }
});
function endPointer(e){
  if(!down) return;
  const wasMoved=down.moved;
  if(dragging){ dragging=false; canvasEl.classList.remove('grabbing');
    const proj=f+fV*0.28; fT=clamp(Math.round(proj),0,N-1); }
  else if(!wasMoved){
    const i=pick(e.clientX,e.clientY);
    if(carried<0 && i>=0){
      if(i===Math.round(fT) && Math.abs(f-i)<.35) takeOff(i);
      else { fT=i; const h=hangables[i]; h.vtx+=.8; }
    }
  }
  down=null;
}
canvasEl.addEventListener('pointerup',endPointer);
canvasEl.addEventListener('pointercancel',endPointer);
canvasEl.addEventListener('pointerleave',()=>{parallax.tx=0;parallax.ty=0;});
let wheelTimer=0;
canvasEl.addEventListener('wheel',e=>{

  if(carried>=0){ hangables[carried].userYaw+=d*0.004; return; }
  fT=clamp(fT+d*0.0045,-.25,N-.75);
  clearTimeout(wheelTimer); wheelTimer=setTimeout(()=>{ fT=clamp(Math.round(fT),0,N-1); },140);
},{passive:false});
addEventListener('keydown',e=>{
  if(e.target && (e.target.tagName==='BUTTON') && (e.key==='Enter'||e.key===' ')) return;
  if(e.key==='ArrowRight'){ if(carried>=0) hangables[carried].userYaw+=.6; else go(1); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ if(carried>=0) hangables[carried].userYaw-=.6; else go(-1); e.preventDefault(); }

let cart=0; const cartEl=document.getElementById('cartCount'), toast=document.getElementById('toast'); let toastT=0;
document.getElementById('addCart').onclick=()=>{ if(carried<0) return; cart++; cartEl.textContent=cart;
  toast.textContent=`Προστέθηκε: ${ITEMS[carried].name} · ${selSize}`; toast.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove('show'),2200); };
const hint=document.getElementById('hint'); let hinted=false;
function dismissHint(){ if(hinted) return; hinted=true; setTimeout(()=>hint.classList.add('gone'),1800); }

addEventListener('resize',()=>{ renderer.setSize(innerWidth,innerHeight); layoutCamera(); });

/* ------------------------------------------------------------------ loop */
let last=performance.now();
function frame(now){
  let dt=Math.min(1/30,(now-last)/1000); last=now;
  const sub=3; for(let s=0;s<sub;s++) step(dt/sub);
  apply(); updateCamera(dt); updateUI();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
updateCamera(1); requestAnimationFrame(frame);
setTimeout(()=>document.getElementById('loading').classList.add('done'),120);
}
(function(){
  const SRC={teeFront:'img/tee-front.png',teeBack:'img/tee-back.png',tankFront:'img/tank-front.png',tankBack:'img/tank-back.png',
    hoodieFront:'img/hoodie-front.png',hoodieBack:'img/hoodie-back.png',teeBlack:'img/tee-black-front.png'};
  const load=u=>new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=u; });
  const photos=Promise.all(Object.entries(SRC).map(([k,u])=>load(u).then(im=>[k,im]))).then(list=>{
    const P=Object.fromEntries(list);
    // file:// pages can't read pixels back from images; then keep the drawn garments
    try{ const c=document.createElement('canvas'); c.width=c.height=2; const g=c.getContext('2d'); g.drawImage(P.teeFront,0,0,2,2); g.getImageData(0,0,1,1); }
    catch(e){ console.warn('Οι φωτογραφίες θέλουν server (όχι file://). Δείχνω τα ζωγραφιστά ρούχα.'); return null; }
    return P;
  }).catch(()=>null);
  const fl = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('900 52px Commissioner'),document.fonts.load('800 18px Commissioner')]).catch(()=>{}) : Promise.resolve();
  const timeout=new Promise(r=>setTimeout(r,2500));
  let started=false;
  Promise.all([photos, Promise.race([fl,timeout])]).then(([P])=>{ if(started) return; started=true; kremastraMain(P); });
})();
</script>
